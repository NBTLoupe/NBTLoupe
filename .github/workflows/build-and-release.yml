name: Build and Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target.rid }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
          - { rid: osx-x64, os: macos-26 }
          - { rid: osx-arm64, os: macos-26 }
          - { rid: win-x64, os: windows-2025 }
          - { rid: win-arm64, os: windows-2025 }
          - { rid: linux-x64, os: ubuntu-26.04 }
          - { rid: linux-arm64, os: ubuntu-26.04-arm } # Cross-compiling doesn't work on GNU/Linux by default, and using an ARM64 runner is quicker than installing the required dependencies on an x86_64 runner.
          

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV


      - name: Publish (Release)
        shell: bash
        run: dotnet publish NBTLoupe -r ${{ matrix.target.rid }} -c Release -o publish/${{ matrix.target.rid }} ${VERSION:+-p:Version=$VERSION}

      - name: Publish (Debug)
        shell: bash
        run: dotnet publish NBTLoupe -r ${{ matrix.target.rid }} -c Debug -o publish-DEBUG/${{ matrix.target.rid }} ${VERSION:+-p:Version=$VERSION-DEBUG}


      - name: Package macOS (.app and .dmg)
        if: startsWith(matrix.target.rid, 'osx-')
        shell: bash
        env:
          RID: ${{ matrix.target.rid }}
        run: ./scripts/package-macos.sh "$VERSION" "$RID"


      - name: Package GNU/Linux (.AppImage)
        if: startsWith(matrix.target.rid, 'linux-')
        shell: bash
        env:
          RID: ${{ matrix.target.rid }}
        run: ./scripts/package-linux.sh "$VERSION" "$RID"


      - name: Package Windows (.zip)
        if: startsWith(matrix.target.rid, 'win-')
        shell: pwsh
        env:
          RID: ${{ matrix.target.rid }}
        run: ./scripts/package-windows.ps1 -Version "$env:VERSION" -Rid "$env:RID"


      - name: Upload artifacts (Release)
        uses: actions/upload-artifact@v7
        with:
          name: NBTLoupe-v${{ env.VERSION }}-RELEASE-${{ matrix.target.rid }}
          path: publish/NBTLoupe-v${{ env.VERSION }}-RELEASE-${{ matrix.target.rid }}.*
          archive: false

      - name: Upload artifacts (Debug)
        uses: actions/upload-artifact@v7
        with:
          name: NBTLoupe-v${{ env.VERSION }}-DEBUG-${{ matrix.target.rid }}
          path: publish-DEBUG/${{ matrix.target.rid }}/

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Create release
        id: uploadRelease
        uses: softprops/action-gh-release@v3
        with:
          name: NBTLoupe ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.AppImage
